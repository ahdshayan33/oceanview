name: OceanView CI

on:
  push:
    branches: [ main, guest-management, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java 8
      uses: actions/setup-java@v3
      with:
        java-version: '8.0.482'
        distribution: 'temurin'

    - name: Compile Java
      run: javac src/**/*.java